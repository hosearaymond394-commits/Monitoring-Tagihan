# Google Cloud Build pipeline: build -> push to Artifact Registry -> deploy to Cloud Run.
# Trigger manually with:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast2,_REPOSITORY=monitoring-tagihan-repo,_SERVICE_NAME=monitoring-tagihan
#
# Or connect this file to a Cloud Build trigger on your Git repo.

substitutions:
  _REGION: asia-southeast2
  _REPOSITORY: monitoring-tagihan-repo
  _SERVICE_NAME: monitoring-tagihan

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--port=8080"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--allow-unauthenticated"

options:
  logging: CLOUD_LOGGING_ONLY
