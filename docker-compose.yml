# For local development/testing of the production Docker image.
# `docker compose up --build` then open http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NEXT_PUBLIC_APP_NAME=Monitoring Tagihan
      # - DATABASE_URL=
      # - STORAGE_BUCKET=
    restart: unless-stopped
